services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/career_platform
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:3000
    ports: ["5000:5000"]
    depends_on: [mongo, redis]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  mongo_data:
